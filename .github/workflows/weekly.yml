name: weekly-golf

on:
  schedule:
    - cron: '0 8 * * 1'     # Mon 08:00 UTC - refresh results, grade last week's bets
    - cron: '0 12 * * 1'    # Mon 12:00 UTC - shortlist (early prices; uses Mac snapshot from 11:30)
    - cron: '0 12 * * 2'    # Tue 12:00 UTC - shortlist update (markets deeper, ISN may be newer)
  workflow_dispatch:
    inputs:
      job:
        description: 'shortlist | grade'
        default: 'shortlist'

permissions:
  contents: write
  issues: write

concurrency: weekly-golf

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Pick job
        id: pick
        run: |
          J="${{ github.event.inputs.job }}"
          case "${{ github.event.schedule }}" in
            '0 12 * * 1'|'0 12 * * 2') J=shortlist ;;
            '0 8 * * 1')   J=grade ;;
          esac
          echo "job=${J:-shortlist}" >> "$GITHUB_OUTPUT"
      - name: Refresh results
        run: |
          YEARS=$(date -u +%Y) python src/espn_fetch.py raw/espn pga eur
          python src/espn_meta.py raw/meta
          python src/espn_parse.py
          python src/features.py && python src/ratings.py
          python src/case_studies.py $(date -u +%Y) 60
      - name: Shortlist
        if: steps.pick.outputs.job == 'shortlist'
        run: |
          python src/weekly/shortlist.py > /dev/null
          python src/extras.py
          python src/export_dashboard.py
          python src/build_html.py
          gh issue create --title "Golf shortlist $(date -u +%Y-%m-%d)" --body-file reports/latest.md
      - name: Grade bets
        if: steps.pick.outputs.job == 'grade'
        run: |
          python src/weekly/grade.py | tee grade.txt
          python src/extras.py
          python src/export_dashboard.py
          python src/build_html.py
          if [ -s grade.txt ]; then gh issue create --title "Golf bets graded $(date -u +%Y-%m-%d)" --body-file grade.txt; fi
      - name: Commit outputs
        run: |
          git config user.name "golf-bot"; git config user.email "golf-bot@users.noreply.github.com"
          git add raw reports bets data/out dist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "weekly-golf: ${{ steps.pick.outputs.job }} $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
